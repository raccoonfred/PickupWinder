[workspace]
resolver = "2"
members = ["crates/winder-core", "crates/winder-gcode", "crates/winder-cli", "crates/winder-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/raccoonfred/PickupWinder"

[workspace.dependencies]
winder-core = { path = "crates/winder-core" }
winder-gcode = { path = "crates/winder-gcode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# The coil model and egui are slow unoptimized; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
