[package]
name = "winder-app"
description = "Desktop design editor for pickup coils: lay patterns, live cross-section, G-code export"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "winder-app"
path = "src/main.rs"

[dependencies]
winder-core.workspace = true
winder-gcode.workspace = true
toml.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
