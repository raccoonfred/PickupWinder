# Vintage-style Strat single-coil: clean base, scattered body, clean cover.
#   winder sim designs/strat-vintage.toml
#   winder gcode designs/strat-vintage.toml -o strat.nc
version = 2
name = "Vintage Strat"
wire = "42 AWG"            # or a [wire] table with name, od_mm, bare_mm, ohm_per_m
direction = "cw"           # cw | ccw (seen from the front of the bobbin)

[bobbin]
channel_height_mm = 11.0   # flange to flange, along the traverse
core_width_mm = 16.0
core_length_mm = 46.0
build_depth_mm = 6.0

[speed]
rpm = 420
ramp_turns = 50            # soft start and soft stop
ramp_start_rpm = 60

# Inputs to the DCR / tone estimate that the toolpath doesn't decide.
[estimate]
pack = 0.92
scatter = 12
tension_g = 35             # leave out to use `pack` directly
temp_c = 20

# How the wire travels from the guide to the coil.
[lay]
free_span_mm = 25          # guide eye to where the wire meets the coil

# Patterns are set the way real winders are: turns per pass (tpl), the turns
# the spindle makes while the guide crosses the window once. 42 AWG lies side
# by side at about 154 on this bobbin; lower numbers cross the wire.
#   layer:   perfect layers, the guide steps one wire per turn
#   helix:   a fixed traverse ratio, like a geared or cam machine
#   scatter: a new turns-per-pass and reversal point for every pass
[[sections]]
turns = 200
pattern = { kind = "layer" }

[[sections]]
turns = 7600
pattern = { kind = "scatter", tpl_min = 85, tpl_max = 130, reversal_jitter_mm = 0.3, seed = 1234 }
dwell_turns = 0.5          # turns laid in place at each reversal

[[sections]]
turns = 200
pattern = { kind = "layer" }
